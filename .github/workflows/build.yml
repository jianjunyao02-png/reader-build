name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --noconsole reader.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-exe
          path: dist/reader.exe
